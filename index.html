  <style>
    :root {
      --bg: #030712;
      --panel: rgba(17, 18, 23, .82);
      --red: #00b7ff;
      --red-dark: #087cff;
      --text: #f4f4f6;
      --muted: #92939d;
      --line: rgba(0, 183, 255, .32);
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 14px;
      display: grid;
      place-items: center;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse at 50% 18%, rgba(0, 75, 180, .24), transparent 48%),
        radial-gradient(ellipse at 50% 90%, rgba(0, 183, 255, .08), transparent 42%),
        var(--bg);
    }
    .page { width: 100%; max-width: 390px; }
    .card {
      position: relative;
      overflow: hidden;
      text-align: center;
      padding: 44px 18px 32px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background:
        radial-gradient(ellipse at 50% 24%, rgba(0, 62, 150, .24), transparent 44%),
        linear-gradient(145deg, rgba(20, 20, 26, .94), rgba(9, 10, 14, .96));
      box-shadow: 0 18px 55px rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.025);
    }
    .avatar-wrap {
      width: 98px; height: 98px; margin: 0 auto 20px; padding: 4px;
      border-radius: 50%;
      border: 1px solid var(--red);
      box-shadow: 0 0 0 3px rgba(0, 183, 255, .10), 0 0 22px rgba(0, 183, 255, .18);
      background: #101116;
    }
    .avatar {
      display: block;
      width: 100%; height: 100%; border-radius: 50%;
      object-fit: cover; object-position: center;
      border: 1px solid rgba(255,255,255,.12);
    }
    .pill {
      display: inline-flex; align-items: center; gap: 7px;
      border: 1px solid rgba(0, 183, 255, .38);
      border-radius: 99px; padding: 6px 12px;
      color: #39c8ff; font-size: 9px; font-weight: 800;
      letter-spacing: 1.6px; text-transform: uppercase;
      background: rgba(0, 183, 255, .045);
    }
    .status-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--red); box-shadow: 0 0 7px var(--red); }
    h1 {
      margin: 14px 0 12px; font-size: clamp(22px, 6vw, 27px);
      line-height: 1.15; font-weight: 850; letter-spacing: .4px;
      overflow-wrap: anywhere;
    }
    .description {
      margin: 0 auto 24px; max-width: 290px;
      color: var(--muted); font-size: 12px; line-height: 1.7;
    }
    .join-button {
      min-height: 48px; width: 100%; display: flex; align-items: center;
      justify-content: space-between; gap: 12px; padding: 0 14px;
      border: 1px solid rgba(130, 220, 255, .4); border-radius: 9px;
      color: white; text-decoration: none;
      background: linear-gradient(100deg, #087cff, #00c8ff);
      box-shadow: 0 8px 24px rgba(0, 140, 255, .24), inset 0 1px 0 rgba(255,255,255,.19);
      transition: transform .18s ease, filter .18s ease;
    }
    .join-button:hover { filter: brightness(1.07); transform: translateY(-1px); }
    .join-button:active { transform: translateY(0); }
    .join-label { flex: 1; text-align: center; font-size: 10px; font-weight: 850; letter-spacing: 1.7px; }
    .telegram-icon { width: 16px; height: 16px; flex: 0 0 auto; }
    .external-icon { font-size: 17px; line-height: 1; }
    .brand-line {
      margin: 25px auto 13px; display: flex; align-items: center;
      justify-content: center; gap: 9px; color: #777983;
      font-size: 7px; letter-spacing: 1.5px; font-weight: 700;
    }
    .brand-line::before, .brand-line::after { content: ""; width: 17px; height: 1px; background: #087cff; }
    .agency-link {
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      max-width: 100%; padding: 9px 13px; border-radius: 999px;
      border: 1px solid rgba(255,255,255,.15);
      background: linear-gradient(135deg, rgba(255,255,255,.075), rgba(255,255,255,.025));
      color: #e7e7eb; text-decoration: none;
      font-size: 9px; font-weight: 750; letter-spacing: 1.05px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 6px 20px rgba(0,0,0,.15);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      transition: border-color .18s ease, background .18s ease;
    }
    .agency-link:hover { border-color: rgba(0, 183, 255, .55); background: rgba(0,183,255,.09); }
    .agency-mark { color: #35c8ff; font-size: 12px; }
    .footer-note { margin-top: 16px; color: #64656e; font-size: 9px; }
    @media (max-width: 360px) {
      .card { padding: 36px 14px 27px; }
      h1 { font-size: 21px; }
      .join-label { letter-spacing: 1.2px; }
      .agency-link { font-size: 8px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
